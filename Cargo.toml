[package]
name = "mbdb"
version = "0.1.0"
edition = "2024"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Database
duckdb = { version = "1", features = ["bundled"] }

# Dump archives (streaming decompression + tar)
bzip2 = "0.4"
xz2 = "0.1"
tar = "0.4"

# Config
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

[dev-dependencies]
tempfile = "3"
[package]
name = "mbdb"
version = "0.1.0"
edition = "2024"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Database
duckdb = { version = "1", features = ["bundled"] }

# Config
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# Error handling
thiserror = "2"

[dev-dependencies]
tempfile = "3"